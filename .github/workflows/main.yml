name: Job Scraper Bot

on:
  schedule:
    # ලංකාවේ වෙලාවට හැදුවා (+5:30)
    - cron: '30 18 * * *'  # ලංකාවේ වෙලාවෙන් පාන්දර 12:00 AM (පෙර දින 18:30 UTC)
    - cron: '30 01 * * *'  # ලංකාවේ වෙලාවෙන් උදේ 07:00 AM (01:30 UTC)
    - cron: '00 12 * * *'  # ලංකාවේ වෙලාවෙන් හවස 05:30 PM (12:00 UTC)
  workflow_dispatch: # අපිට ඕනෙ වෙලාවට Manual රන් කරන්නත් පුළුවන්

permissions:
  contents: write # seen_jobs.txt එක ආයෙත් සේව් කරන්න අවසර දෙනවා

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper Bot
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: python job_bot.py

      - name: Save seen_jobs.txt back to repo
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add seen_jobs.txt
          # වෙනසක් වෙලා තියෙනවා නම් විතරක් සේව් කරනවා
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated seen_jobs.txt" && git push)
